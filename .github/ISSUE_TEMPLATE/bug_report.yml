name: Bug report
description: Report a reproducible problem in a skill, installer, validator, or repository workflow.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: input
    id: version
    attributes:
      label: Library version or commit
      placeholder: "3.0.0 or commit SHA"
    validations:
      required: true
  - type: input
    id: skill
    attributes:
      label: Skill or component
      placeholder: "e.g. frontend-ui-engineering"
    validations:
      required: true
  - type: input
    id: client
    attributes:
      label: AI client and version (if applicable)
      placeholder: "e.g. client name and exact version"
    validations:
      required: false
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Include minimal steps and safe sample data. Do not include secrets or real customer data.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: textarea
    id: checks
    attributes:
      label: Checks performed
      description: Include command output or exact error. Redact tokens, personal data, and private URLs.
    validations:
      required: false
