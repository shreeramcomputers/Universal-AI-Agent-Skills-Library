name: Build and publish release archive

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to package
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Validate, package, and publish
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Validate source
        run: |
          python3 scripts/validate_skills.py
          python3 -m unittest discover -s tests -v

      - name: Create release archives and checksums
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME}"
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            VERSION="${{ inputs.tag }}"
          fi
          mkdir -p dist
          python3 - "$VERSION" <<'PY'
          import sys, zipfile, tarfile
          from pathlib import Path
          version = sys.argv[1]
          root = Path(".")
          included = [
              "skills", "GLOBAL_RULES.md", "SKILL_RULES.md", "PROJECT_CONFIG.md",
              "CATALOG.json", "LICENSE", "LICENSE-CODE", "LICENSE-CONTENT.md", "INSTALLATION.md",
              "MIGRATION.md", "README.md", "CHANGELOG.md", "scripts/install_skill.py",
              "scripts/validate_skills.py"
          ]
          zip_path = Path("dist") / f"Universal-AI-Agent-Skills-Library-{version}.zip"
          tar_path = Path("dist") / f"Universal-AI-Agent-Skills-Library-{version}.tar.gz"
          with zipfile.ZipFile(zip_path, "w", zipfile.ZIP_DEFLATED, compresslevel=9) as zf:
              for name in included:
                  path = root / name
                  if path.is_dir():
                      for file in sorted(path.rglob("*")):
                          if file.is_file():
                              zf.write(file, Path(f"Universal-AI-Agent-Skills-Library-{version}") / file)
                  elif path.is_file():
                      zf.write(path, Path(f"Universal-AI-Agent-Skills-Library-{version}") / path)
          with tarfile.open(tar_path, "w:gz") as tf:
              for name in included:
                  path = root / name
                  if path.is_dir():
                      for file in sorted(path.rglob("*")):
                          if file.is_file():
                              tf.add(file, arcname=Path(f"Universal-AI-Agent-Skills-Library-{version}") / file)
                  elif path.is_file():
                      tf.add(path, arcname=Path(f"Universal-AI-Agent-Skills-Library-{version}") / path)
          PY
          (cd dist && sha256sum *.zip *.tar.gz > SHA256SUMS.txt)

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME}"
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            VERSION="${{ inputs.tag }}"
          fi
          gh release create "$VERSION" dist/* \
            --title "Universal AI Agent Skills Library $VERSION" \
            --generate-notes
