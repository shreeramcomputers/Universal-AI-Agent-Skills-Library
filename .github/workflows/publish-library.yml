name: Publish Universal AI Agent Skills Library

on:
  push:
    branches:
      - main
    paths:
      - "release-artifacts/part-*"
      - ".github/workflows/publish-library.yml"

permissions:
  contents: write

jobs:
  install-release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: true

      - name: Rebuild and verify sanitized release archive
        id: rebuild
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          parts=(release-artifacts/part-*)
          if [ "${#parts[@]}" -eq 0 ]; then
            echo "archive_present=false" >> "$GITHUB_OUTPUT"
            echo "No staged release parts remain; nothing to install."
            exit 0
          fi
          echo "archive_present=true" >> "$GITHUB_OUTPUT"

          mkdir -p "${RUNNER_TEMP}/skills-release"
          cat "${parts[@]}" > "${RUNNER_TEMP}/library.tar.xz"

          echo "50918f00b81d9d9c629c120cd5152d9500aec099c242ea4f3497464eb4a0812c  ${RUNNER_TEMP}/library.tar.xz" | sha256sum --check -
          tar -xJf "${RUNNER_TEMP}/library.tar.xz" -C "${RUNNER_TEMP}/skills-release"

          BUNDLE="${RUNNER_TEMP}/skills-release/Universal-AI-Agent-Skills-Library-v2.2.0"
          test -f "$BUNDLE/GLOBAL_RULES.md"
          test -f "$BUNDLE/SKILL_RULES.md"
          test -f "$BUNDLE/PROJECT_CONFIG.md"
          test -f "$BUNDLE/CATALOG.json"
          test -f "$BUNDLE/VALIDATION_REPORT.md"
          test "$(find "$BUNDLE/skills" -mindepth 2 -maxdepth 2 -name SKILL.md | wc -l)" -eq 31

          python3 - "$BUNDLE" <<'PY'
          import json, re, sys
          from pathlib import Path
          root = Path(sys.argv[1])
          catalog = json.loads((root / "CATALOG.json").read_text(encoding="utf-8"))
          assert catalog.get("skill_count") == 31
          skills = list((root / "skills").glob("*/SKILL.md"))
          assert len(skills) == 31
          forbidden = [
              re.compile(r"(?i)shree\s*ram\s*computers"),
              re.compile(r"(?i)shreeramcomputers"),
              re.compile(r"(?i)gaurav"),
              re.compile(r"(?i)daurala"),
              re.compile(r"(?i)meerut"),
              re.compile(r"(?i)@shreeram"),
              re.compile(r"(?i)shreeramcomputers\.com"),
          ]
          for file in root.rglob("*"):
              if file.is_file() and file.suffix.lower() in {".md", ".json", ".txt", ".yml", ".yaml"}:
                  text = file.read_text(encoding="utf-8")
                  for pattern in forbidden:
                      assert not pattern.search(text), f"Privacy scan failed in {file}: {pattern.pattern}"
          for skill in skills:
              text = skill.read_text(encoding="utf-8")
              assert text.startswith("---\nname: ")
              for shared in ("GLOBAL_RULES.md", "SKILL_RULES.md", "PROJECT_CONFIG.md"):
                  assert f"../../{shared}" in text, f"{shared} reference missing in {skill}"
          print("PASS: 31 skills, catalog, shared-rule links and known-private-identifier scan")
          PY

      - name: Install the library
        if: steps.rebuild.outputs.archive_present == 'true'
        shell: bash
        run: |
          set -euo pipefail
          BUNDLE="${RUNNER_TEMP}/skills-release/Universal-AI-Agent-Skills-Library-v2.2.0"

          # Refuse to overwrite any existing skill or shared rule file.
          test ! -e skills
          for file in GLOBAL_RULES.md SKILL_RULES.md PROJECT_CONFIG.md; do
            test ! -e "$file"
          done

          mkdir -p skills docs/v2.2.0 releases
          cp -a "$BUNDLE/skills/." skills/
          cp "$BUNDLE/GLOBAL_RULES.md" "$BUNDLE/SKILL_RULES.md" "$BUNDLE/PROJECT_CONFIG.md" .
          cp "$BUNDLE/README.md" README.md
          cp "$BUNDLE/CATALOG.json" "$BUNDLE/CHANGELOG.md" "$BUNDLE/MIGRATION.md" "$BUNDLE/VALIDATION_REPORT.md" docs/v2.2.0/
          cp "${RUNNER_TEMP}/library.tar.xz" releases/Universal-AI-Agent-Skills-Library-v2.2.0.tar.xz

          python3 - "$BUNDLE" <<'PY'
          import sys, zipfile
          from pathlib import Path
          root = Path(sys.argv[1])
          target = Path("releases/Universal-AI-Agent-Skills-Library-v2.2.0.zip")
          with zipfile.ZipFile(target, "w", zipfile.ZIP_DEFLATED, compresslevel=9) as archive:
              for item in sorted(root.rglob("*")):
                  if item.is_file():
                      archive.write(item, item.relative_to(root.parent))
          PY

          # Remove temporary encoded transport parts from the public repository.
          rm -rf release-artifacts

      - name: Commit installed files
        if: steps.rebuild.outputs.archive_present == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to publish."
            exit 0
          fi
          git commit -m "Publish Universal AI Agent Skills Library v2.2.0"
          git push origin HEAD:main
